    <script>
      // Sin FOUC: estados ocultos solo bajo html.js-motion. Intro solo en primera visita, sin #hash y sin reduced motion.
      (function () {
        var d = document.documentElement;
        d.classList.remove("no-js");
        d.classList.add("js");
        var rm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!rm) d.classList.add("js-motion");
        var seen = false;
        try { seen = sessionStorage.getItem("cc-intro") === "1"; } catch (e) {}
        if (!rm && !seen && !location.hash) d.classList.add("intro-on");
        // seguridad: si el JS no llega, todo queda visible
        window.__ccFail = setTimeout(function () { d.classList.remove("js-motion", "intro-on"); }, 4500);
      })();
    </script>
